name: signflow

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-signflow}
      MYSQL_USER: ${DB_USER:-signflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_STORAGE_ACCESS_KEY:?Set MEDIA_STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MEDIA_STORAGE_SECRET_KEY:?Set MEDIA_STORAGE_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set signflow http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing signflow/"$${MEDIA_STORAGE_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MEDIA_STORAGE_ACCESS_KEY:?Set MEDIA_STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MEDIA_STORAGE_SECRET_KEY:?Set MEDIA_STORAGE_SECRET_KEY in .env}
      MEDIA_STORAGE_BUCKET: ${MEDIA_STORAGE_BUCKET:-signflow-media}

  web:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment: &backend-environment
      DJANGO_SETTINGS_MODULE: web_project.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-0}
      DB_NAME: ${DB_NAME:-signflow}
      DB_USER: ${DB_USER:-signflow}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/2
      CACHE_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/3
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/1
      MODEL_STORAGE_ROOT: /app/model
      MEDIA_STORAGE_BACKEND: s3
      MEDIA_STORAGE_BUCKET: ${MEDIA_STORAGE_BUCKET:-signflow-media}
      MEDIA_STORAGE_ENDPOINT: http://minio:9000
      MEDIA_STORAGE_ACCESS_KEY: ${MEDIA_STORAGE_ACCESS_KEY:?Set MEDIA_STORAGE_ACCESS_KEY in .env}
      MEDIA_STORAGE_SECRET_KEY: ${MEDIA_STORAGE_SECRET_KEY:?Set MEDIA_STORAGE_SECRET_KEY in .env}
      MEDIA_STORAGE_REGION: ${MEDIA_STORAGE_REGION:-us-east-1}
      ENABLE_CAMERA_WEBSOCKET: "1"
      DETECTION_AUTO_DISPATCH: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      YOLO_AUTOINSTALL: "false"
      RUN_DJANGO_BOOTSTRAP: "1"
    volumes:
      - ./web_project/model:/app/model:ro
      - static_data:/app/staticfiles
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=5)",
        ]
      interval: 15s
      timeout: 7s
      retries: 20
      start_period: 45s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "web_project",
        "worker",
        "--loglevel=INFO",
        "--queues=detections",
        "--concurrency=2",
      ]
    environment:
      <<: *backend-environment
      RUN_DJANGO_BOOTSTRAP: "0"
    volumes:
      - ./web_project/model:/app/model:ro
    depends_on:
      web:
        condition: service_healthy

  worker-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "web_project",
        "worker",
        "--loglevel=INFO",
        "--queues=detections",
        "--concurrency=1",
        "--hostname=gpu@%h",
      ]
    environment:
      <<: *backend-environment
      RUN_DJANGO_BOOTSTRAP: "0"
    volumes:
      - ./web_project/model:/app/model:ro
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend-build:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - frontend_dist:/output
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SIGNFLOW_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      web:
        condition: service_healthy

volumes:
  frontend_dist:
  mysql_data:
  redis_data:
  minio_data:
  static_data:
