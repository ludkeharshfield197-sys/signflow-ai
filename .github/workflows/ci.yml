name: SignFlow CI

on:
  pull_request:
  push:
    branches: [main, master, "codex/**"]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sign
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sign/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test:unit
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web_project/requirements/*.txt
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: python -m pip install -r requirements/dev.txt -r requirements/prod.txt
      - run: ruff format --check api detections health inference storage web_project tests
      - run: ruff check api detections health inference storage web_project tests
      - run: pytest -q
      - name: Django production deployment checks
        env:
          DJANGO_SECRET_KEY: ci-only-signflow-secret-that-is-longer-than-fifty-characters-0001
          DJANGO_ALLOWED_HOSTS: signflow.example.test
          CORS_ALLOWED_ORIGINS: https://signflow.example.test
          CSRF_TRUSTED_ORIGINS: https://signflow.example.test
          DB_NAME: signflow
          DB_USER: signflow
          DB_PASSWORD: ci-database-password
          DB_HOST: mysql
          DB_PORT: "3306"
          MODEL_STORAGE_ROOT: /tmp/signflow-models
          MEDIA_STORAGE_BACKEND: s3
          MEDIA_STORAGE_BUCKET: signflow-ci
          MEDIA_STORAGE_ENDPOINT: https://storage.example.test
          MEDIA_STORAGE_ACCESS_KEY: ci-access
          MEDIA_STORAGE_SECRET_KEY: ci-secret-value
        run: |
          mkdir -p /tmp/signflow-models
          python manage.py check --deploy --settings=web_project.settings.prod

  containers:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.frontend -t signflow-frontend:ci .
      - run: docker build -f Dockerfile.backend -t signflow-backend:ci .
